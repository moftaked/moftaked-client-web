        <app-success-message [message]="message"/>

                </div>

                    {{ currentAttributeRendered }}
                </div>         
                <div class="slider-control" (click)="navigateAttributesOptions(-1)">
                    <div class="svg-button">
                        <svg width="100%" height="100%" viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M0.396894 0.646131C0.443339 0.599568 0.498515 0.562625 0.55926 0.537418C0.620005 0.512212 0.685126 0.499237 0.750894 0.499237C0.816661 0.499237 0.881782 0.512212 0.942527 0.537418C1.00327 0.562625 1.05845 0.599568 1.10489 0.646131L7.10489 6.64613C7.15146 6.69258 7.1884 6.74775 7.21361 6.8085C7.23881 6.86924 7.25179 6.93436 7.25179 7.00013C7.25179 7.0659 7.23881 7.13102 7.21361 7.19176C7.1884 7.25251 7.15146 7.30768 7.10489 7.35413L1.10489 13.3541C1.01101 13.448 0.883669 13.5008 0.750894 13.5008C0.618118 13.5008 0.49078 13.448 0.396894 13.3541C0.303007 13.2602 0.250262 13.1329 0.250262 13.0001C0.250262 12.8674 0.303007 12.74 0.396894 12.6461L6.04389 7.00013L0.396894 1.35413C0.35033 1.30769 0.313387 1.25251 0.288181 1.19176C0.262974 1.13102 0.25 1.0659 0.25 1.00013C0.25 0.934364 0.262974 0.869242 0.288181 0.808497C0.313387 0.747752 0.35033 0.692577 0.396894 0.646131Z" fill="#F5F5F5"/>
                        </svg>                    
                    </div>
                </div>           
            </div>
            <div class="column-title">الاسم</div>
        </div>
        <hr>
        <div class="table-body">
            @for (student of students; track student.student_id) {
                <div class="row" (click)="openEditDialog(student.student_id)">
                    <div class="cell">
                        {{student[currentAttributeActual]}}
                    </div>
                    <div class="cell">
                        {{student.student_name}}
                    </div>
                </div>
            }
        </div>
    </div>


    <div>
        العدد الإجمالي: {{totalCount}}
    </div>
</div>
