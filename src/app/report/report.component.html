<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<div>
    <app-app-header />
    <div id="page-body">
        اختار التاريخ
        <div class="date-picker" style="display: flex; gap: 5px;">
            <select [(ngModel)]="selectedDay" class="date-menu">
                @for (day of days; track $index) {
                    <option [value]="day">{{ day }}</option>
                }
            </select>
              
            <select [(ngModel)]="selectedMonth" (ngModelChange)="updateDays()" class="date-menu">
                @for (month of months; track $index) {
                    <option [value]="month">{{ month }}</option>
                }
            </select>
            
            <select [(ngModel)]="selectedYear" (ngModelChange)="updateDays()" class="date-menu">
                @for (year of years; track $index) {
                    <option [value]="year">{{ year }}</option>
                }
            </select>
        </div>
        <div class="button" (click)="getReports()">
            تمام
            <svg xmlns="http://www.w3.org/2000/svg" width="4vh" height="4vh" fill="#0F3A57" class="bi bi-check-square-fill" viewBox="0 0 16 16">
                <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm10.03 4.97a.75.75 0 0 1 .011 1.05l-3.992 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.75.75 0 0 1 1.08-.022z"/>
              </svg>              
        </div>
        @for(school of overAllStats?.overAllStats; track school.school_name) {
            <div class="label">
                {{school.school_name}}
            </div>
            <div class="v-section">
                @for(event of school.stats; track event.event_name) {
                    {{event.event_name}}
                    <div class="h-section">
                        @for(stats of event.stats; track $index) {
                            <div (click)="openEventReport(school.school_id, event.event_name, stats.type)" class="v-section" style="flex-grow: 1;">
                                <div style="flex-grow: 1; width: 100%; user-select: none;">
                                    <div style="padding: 0.75rem; background-color: #2692D9; border-radius: 10px; width: fit-content; margin: auto;">
                                        <div class="event-type">
                                            {{stats.type === 'student'? 'مخدومين': 'خدام'}}
                                        </div>
                                        <svg viewBox="0 0 36 36" style="max-height: 200px; max-width: 200px;" width="40vw" height="40vw">
                                            <circle cx="18" cy="18" r="16" fill="none" stroke="#ddd" stroke-width="2" />
                                            <circle
                                              cx="18"
                                              cy="18"
                                              r="16"
                                              fill="none"
                                              stroke="#0F3A57"
                                              stroke-width="2"
                                              stroke-dasharray="100"
                                              stroke-linecap="round"
                                              style="transform-origin: 50%; transform: rotate(-90deg);"
                                              [attr.stroke-dashoffset]="100-stats.attended*100/stats.total"
                                            />
                                            <text x="50%" y="56.21%" text-anchor="middle" fill="#F5F5F5" font-size="0.5rem" font-family="tajawal-bold">{{ stats.attended + ' / '+ stats.total }}</text>
                                            <text x="50%" y="76.626%" text-anchor="middle" fill="#F5F5F5" font-size="0.35rem" font-family="tajawal-regular">{{ math.floor(stats.attended*100/stats.total)+'%' }}</text>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        }
                    </div>
                }
            </div>
        }
    </div>
</div>
<app-nav-menu />
