<app-app-header />
<div class="body">
    <div id="page-title">
        @if (mode === 'add') {
            مخدوم جديد
        }
        @if (mode === 'edit') {
            تعديل بيانات: {{student.student_name}}
        }
    </div>
    @if (mode === 'edit') {
        <button class="delete-button" (click)="onDeleteButtonClick()">
            <svg xmlns="http://www.w3.org/2000/svg" width="4.4vh" height="4.4vh" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
            </svg>
            {{deleteButtonText}}
        </button>
    }
    @if (deleteErrorMessage !== '') {
        <app-error-message [message]="deleteErrorMessage" />
    }
    @if (deleteSuccessMessage !== '') {
        <app-success-message [message]="deleteSuccessMessage" />
    }
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
        <div class="form-control">
            <label for="name">الاسم</label>
            <input type="text" formControlName="student_name" name="name" autocomplete="off"/>
        </div>
        <div class="form-control">
            <label for="address">العنوان</label>
            <textarea formControlName="address" name="address" rows="3" autocomplete="off"></textarea>
        </div>
        <div class="form-control">
            <label for="district">المنطقة (الأبراج، شبرا، ...)</label>
            <input type="text" formControlName="district" name="district" autocomplete="off"/>
        </div>
        <div class="form-control">
            <label for="phone">رقم تليفون</label>
            <input type="text" formControlName="phone_number" name="phone" autocomplete="off"/>
        </div>
        <div class="form-control">
            <label for="secondPhone">رقم تليفون كمان (اختياري)</label>
            <input type="text" formControlName="second_phone_number" name="secondPhone" autocomplete="off"/>
        </div>
        <div class="form-control">
            <label for="notes">ملاحظات (اختياري)</label>
            <textarea formControlName="notes" name="notes" rows="3" autocomplete="off"></textarea>
        </div>
        @if (successMessage !== '') {
            <app-success-message [message]="successMessage" />
        }
        @if (errorMessage !== '') {
            <app-error-message [message]="errorMessage" />
        }
        <button [disabled]="buttonDisabled" type="submit">
            @if(loading) {
                <svg width="4vh" height="4vh" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="40" stroke="#0F3A57" stroke-width="4" fill="none">
                      <animate attributeName="r" from="40" to="50" dur="1s" repeatCount="indefinite" />
                      <animate attributeName="opacity" from="1" to="0.2" dur="1s" repeatCount="indefinite" />
                    </circle>
                </svg>
            } @else {
                تمام كدا
            }
        </button>
    </form>
</div>
<app-nav-menu />
